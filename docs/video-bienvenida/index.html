<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 800;
        src: url("assets/barlow-condensed-latin-800-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 600;
        src: url("assets/barlow-condensed-latin-600-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0f1114;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0f1114;
        font-family: "Barlow Condensed", sans-serif;
        color: #f5f3f0;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* Fondo oscuro con brillo cálido (escenas de producto). */
      .fondo-calido {
        background:
          radial-gradient(ellipse 55% 65% at 64% 55%, rgba(233, 112, 47, 0.38), rgba(15, 17, 20, 0) 70%),
          #0f1114;
      }
      video.clip,
      .foto-full {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Velo para que el texto de la derecha se lea sobre el vídeo. */
      .velo-dcha {
        position: absolute;
        inset: 0;
        background: linear-gradient(270deg, rgba(15, 17, 20, 0.75) 0%, rgba(15, 17, 20, 0.35) 40%, rgba(15, 17, 20, 0) 65%);
      }
      /* Los textos van en la mitad derecha: a la izquierda, en el kiosco,
         está la tarjeta de elegir idioma. */
      .titulo {
        position: absolute;
        right: 160px;
        text-align: right;
        z-index: 5;
      }
      .titulo.izq {
        right: auto;
        left: 150px;
        text-align: left;
      }
      /* Velo más fuerte para la escena del dürüm (fondo claro: tortilla). */
      .velo-dcha-fuerte {
        position: absolute;
        inset: 0;
        background: linear-gradient(270deg, rgba(15, 17, 20, 0.9) 0%, rgba(15, 17, 20, 0.7) 30%, rgba(15, 17, 20, 0.25) 52%, rgba(15, 17, 20, 0) 68%);
      }
      .velo-izq {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(15, 17, 20, 0.82) 0%, rgba(15, 17, 20, 0.5) 38%, rgba(15, 17, 20, 0) 58%);
      }
      /* Sombra alrededor del vídeo vertical (compuesto sobre su copia desenfocada). */
      .marco-vertical {
        position: absolute;
        left: 1150px;
        top: 0;
        width: 608px;
        height: 1080px;
        box-shadow: 0 0 90px 10px rgba(0, 0, 0, 0.7);
        z-index: 1;
      }
      .etiqueta {
        display: inline-block;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 24px rgba(0, 0, 0, 0.7);
        font-weight: 600;
        font-size: 34px;
        letter-spacing: 0.32em;
        color: #e9702f;
        text-transform: uppercase;
      }
      .grande {
        display: block;
        font-weight: 800;
        font-size: 210px;
        line-height: 0.86;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        text-shadow: 0 12px 50px rgba(0, 0, 0, 0.55);
      }
      .grande span {
        display: inline-block;
      }
      .sub {
        display: block;
        margin-top: 18px;
        font-weight: 600;
        font-size: 44px;
        color: rgba(245, 243, 240, 0.85);
      }
      .producto {
        position: absolute;
        z-index: 3;
        filter: drop-shadow(0 40px 60px rgba(0, 0, 0, 0.6));
      }
      .brasa {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ffb36b;
        box-shadow: 0 0 14px 4px rgba(255, 140, 50, 0.85);
        z-index: 4;
      }
      /* Barrido naranja entre escenas. */
      .barrido {
        position: absolute;
        top: -10%;
        left: 0;
        width: 70%;
        height: 120%;
        background: linear-gradient(90deg, #e9702f, #f0ad4e);
        transform: skewX(-14deg);
        z-index: 20;
      }
      #logo {
        position: absolute;
        left: 560px;
        top: 360px;
        width: 800px;
        z-index: 6;
        /* Logo sin caja de fondo: sombra para que se lea sobre el asador. */
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 36px rgba(0, 0, 0, 0.6));
      }
      .negro {
        background: #0f1114;
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.5" data-width="1920" data-height="1080">
      <!-- 1 · Cortando el döner (0–7.5 s): clip vertical a la derecha sobre su copia desenfocada -->
      <video id="v1" class="clip" src="assets/corte.mp4" data-start="0" data-duration="7.5" muted></video>
      <div class="marco-vertical" data-start="0" data-duration="7.5"></div>
      <div class="clip velo-izq" data-start="0" data-duration="7.5" style="z-index: 2"></div>
      <div id="t1" class="titulo izq" style="top: 300px" data-start="0" data-duration="7.5">
        <span class="etiqueta">Recién cortado</span>
        <span class="grande" id="t1-grande"><span>K</span><span>E</span><span>B</span><span>A</span><span>B</span></span>
        <span class="sub">Döner asado al momento</span>
      </div>

      <!-- 2 · Montando el dürüm (7.5–15 s) -->
      <video id="v2" class="clip" src="assets/montaje.mp4" data-start="7.5" data-duration="7.5" muted></video>
      <div class="clip velo-dcha-fuerte" data-start="7.5" data-duration="7.5"></div>
      <div id="t2" class="titulo" style="top: 320px" data-start="7.5" data-duration="7.5">
        <span class="etiqueta">Hecho al momento</span>
        <span class="grande" style="margin-top: 44px">Dürüm</span>
        <span class="sub">Delante de ti</span>
      </div>

      <!-- 3 · Enrollándolo (15–21 s) -->
      <video id="v3" class="clip" src="assets/enrollado.mp4" data-start="15" data-duration="6" muted></video>
      <div class="clip velo-izq" data-start="15" data-duration="6"></div>
      <div id="t3" class="titulo izq" style="top: 360px" data-start="15" data-duration="6">
        <span class="etiqueta">Enrollado a mano</span>
        <span class="grande" style="font-size: 170px">Listo<br />para ti</span>
      </div>

      <!-- 4 · Logo (21–25.5 s) -->
      <div id="s4" class="clip fondo-calido" data-start="21" data-duration="4.5" style="background: radial-gradient(ellipse 55% 65% at 50% 52%, rgba(233, 112, 47, 0.38), rgba(15, 17, 20, 0) 70%), #0f1114"></div>
      <img id="logo" src="assets/logo.svg" data-start="21" data-duration="4.5" alt="" />
      <div id="t4" class="titulo" style="top: 640px; left: 0; right: 0; text-align: center" data-start="21" data-duration="4.5">
        <span class="sub" style="font-size: 52px">Kebab · Hamburguesería · Pizzería</span>
      </div>

      <!-- Brasas (asador y logo) -->
      <div id="brasas" class="clip" data-start="0" data-duration="25.5" style="z-index: 8"></div>

      <!-- Barridos de transición -->
      <div id="b1" class="barrido" data-start="7.05" data-duration="0.9"></div>
      <div id="b2" class="barrido" data-start="14.55" data-duration="0.9"></div>
      <div id="b3" class="barrido" data-start="20.55" data-duration="0.9"></div>

      <!-- Fundido de entrada/salida para que el bucle no dé salto -->
      <div id="negro-in" class="clip negro" data-start="0" data-duration="0.6"></div>
      <div id="negro-out" class="clip negro" data-start="24.9" data-duration="0.6"></div>
    </div>

    <script>
      // Brasas con posiciones deterministas (sin Math.random: el render
      // tiene que salir idéntico cada vez).
      const DUR = 25.5;
      let semilla = 7;
      const azar = () => {
        semilla = (semilla * 16807) % 2147483647;
        return (semilla - 1) / 2147483646;
      };
      const contenedor = document.getElementById("brasas");
      const brasas = [];
      for (let i = 0; i < 34; i++) {
        const b = document.createElement("div");
        b.className = "brasa";
        const tam = 4 + azar() * 7;
        b.style.width = b.style.height = tam + "px";
        b.style.left = 80 + azar() * 1760 + "px";
        b.style.top = 1100 + "px";
        contenedor.appendChild(b);
        brasas.push({ el: b, retraso: azar() * DUR, dur: 5 + azar() * 4, deriva: (azar() - 0.5) * 220 });
      }

      const tl = gsap.timeline({ paused: true });

      for (const b of brasas) {
        for (let t = b.retraso - DUR; t < DUR; t += b.dur + 1.5) {
          if (t + b.dur < 0) continue;
          tl.fromTo(
            b.el,
            { y: 0, x: 0, opacity: 0 },
            { y: -(700 + b.deriva * 2), x: b.deriva, opacity: 1, duration: b.dur * 0.25, ease: "none" },
            Math.max(0, t)
          );
          tl.to(b.el, { y: -(1150 + b.deriva * 2), x: b.deriva * 1.6, opacity: 0, duration: b.dur * 0.75, ease: "none" }, Math.max(0, t) + b.dur * 0.25);
        }
      }
      // Las brasas solo en el asador y en el logo, no sobre el dürüm.
      tl.to("#brasas", { opacity: 0, duration: 0.4, ease: "none" }, 7.1);
      tl.to("#brasas", { opacity: 1, duration: 0.6, ease: "none" }, 21);

      tl.fromTo("#negro-in", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.out" }, 0);

      // 1 · KEBAB
      tl.fromTo("#v1", { scale: 1 }, { scale: 1.05, duration: 7.5, ease: "none" }, 0);
      tl.from("#t1 .etiqueta", { x: -80, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.from("#t1-grande span", { y: 140, opacity: 0, rotation: -8, duration: 0.7, stagger: 0.08, ease: "back.out(1.6)" }, 0.6);
      tl.from("#t1 .sub", { x: -80, opacity: 0, duration: 0.6, ease: "power3.out" }, 1.3);

      for (const [id, t] of [["#b1", 7.05], ["#b2", 14.55], ["#b3", 20.55]]) {
        tl.fromTo(id, { xPercent: -160 }, { xPercent: 230, duration: 0.9, ease: "power2.inOut" }, t);
      }

      // 2 · DÜRÜM
      tl.fromTo("#v2", { scale: 1.08 }, { scale: 1.0, duration: 7.5, ease: "none" }, 7.5);
      tl.from("#t2 .etiqueta", { x: 80, opacity: 0, duration: 0.5, ease: "power3.out" }, 8.0);
      tl.from("#t2 .grande", { scale: 1.5, opacity: 0, duration: 0.7, ease: "power4.out" }, 8.15);
      tl.from("#t2 .sub", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, 8.7);

      // 3 · Listo para ti
      tl.fromTo("#v3", { scale: 1.0 }, { scale: 1.07, duration: 6, ease: "none" }, 15);
      tl.from("#t3 .etiqueta", { x: -80, opacity: 0, duration: 0.5, ease: "power3.out" }, 15.5);
      tl.from("#t3 .grande", { x: -140, opacity: 0, duration: 0.7, ease: "power3.out" }, 15.7);

      // 4 · Logo
      tl.from("#logo", { scale: 0.7, opacity: 0, duration: 0.9, ease: "back.out(1.5)" }, 21.3);
      tl.from("#t4 .sub", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out" }, 22.0);

      tl.fromTo("#negro-out", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.in" }, 24.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
